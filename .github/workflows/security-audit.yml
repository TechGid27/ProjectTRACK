# ──────────────────────────────────────────────────────────────────────────────
# ProjectTrack — Security Audit
# ──────────────────────────────────────────────────────────────────────────────
# Scans Python and Node.js dependencies for known vulnerabilities.
# Runs weekly on Monday mornings and on every push that touches lockfiles.
# ──────────────────────────────────────────────────────────────────────────────

name: Security Audit

on:
  schedule:
    - cron: "0 6 * * 1" # Every Monday at 06:00 UTC
  push:
    branches: [development, main]
    paths:
      - "**/requirements.txt"
      - "**/package-lock.json"
      - "**/pnpm-lock.yaml"
  workflow_dispatch:

jobs:
  # ── Python ─────────────────────────────────────────────────────────────────

  python:
    name: Python — pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit backend/requirements.txt
        run: pip-audit -r backend/requirements.txt --desc

      - name: Audit backend/backend/requirements.txt
        run: pip-audit -r backend/backend/requirements.txt --desc

  # ── Website ────────────────────────────────────────────────────────────────

  website:
    name: Website — npm audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Website
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm ci
      - run: npm audit --audit-level=high

  # ── Mobile ─────────────────────────────────────────────────────────────────

  mobile:
    name: Mobile — npm audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm ci
      # Allowlist-aware gate: the Expo SDK 52 / React Native build toolchain ships
      # transitive advisories (node-tar, node-forge, postcss, braces, ...) whose
      # only npm remediation is a breaking `expo@44` downgrade. Those known ids
      # are accepted in mobile/.npm-audit-allow.json; the gate still FAILS on any
      # new high/critical advisory outside that set. Prune the allowlist on each
      # Expo SDK upgrade.
      - run: npm run audit
