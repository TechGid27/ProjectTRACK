# ──────────────────────────────────────────────────────────────────────────────
# ProjectTrack — Continuous Integration
# ──────────────────────────────────────────────────────────────────────────────
# Runs lint + test for every component on each push or pull request to the
# development and main branches. All three jobs run in parallel.
# ──────────────────────────────────────────────────────────────────────────────

name: CI

on:
  push:
    branches: [development, main]
  pull_request:
    branches: [development]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# ── Backend ──────────────────────────────────────────────────────────────────

jobs:
  backend:
    name: Backend — Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/backend/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install flake8 black pytest pytest-asyncio httpx

      - name: Lint — flake8
        run: flake8 backend/ --max-line-length=120 --exclude=__pycache__

      - name: Format check — black
        run: black --check backend/

      - name: Run tests
        run: python -m pytest backend/tests/ -v --tb=short
        env:
          NEO4J_URI: ""
          NEO4J_PASSWORD: ""
          LLM_API_KEY: ""
          SUPABASE_URL: ""
          SUPABASE_SERVICE_KEY: ""
          SUPABASE_ANON_KEY: ""

# ── Website ──────────────────────────────────────────────────────────────────

  website:
    name: Website — Lint, Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Website
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: Website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint — ESLint
        run: npm run lint

      - name: Test — Vitest
        run: npm run test

      - name: Build — Vite production bundle
        run: npm run build

# ── Mobile ───────────────────────────────────────────────────────────────────

  mobile:
    name: Mobile — Lint, Typecheck & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint — ESLint
        run: npm run lint

      - name: Typecheck — TypeScript
        run: npm run typecheck

      - name: Test — Jest
        run: npm run test
